name: neerikkha
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neerikkha
      POSTGRES_DB: neerikkha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neerikkha -d neerikkha"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.52
    command: mini -dir=/data -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-neerikkha}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-local-storage-only}
      S3_BUCKET: neerikkha-documents
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["storage_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  chroma:
    image: chromadb/chroma:1.0.20
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["chroma_data:/data"]
  api:
    build: ./backend
    environment: &backend_environment
      NEERIKKHA_DATABASE_URL: postgresql://neerikkha:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/neerikkha
      NEERIKKHA_REDIS_URL: redis://redis:6379/0
      NEERIKKHA_STORAGE_URL: http://storage:8333
      NEERIKKHA_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-neerikkha}
      NEERIKKHA_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-local-storage-only}
      NEERIKKHA_VECTOR_URL: http://chroma:8000
      NEERIKKHA_OCR_ENGINE: ${OCR_ENGINE:-gemini}
      NEERIKKHA_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      NEERIKKHA_GEMINI_PASSES: ${GEMINI_PASSES:-2}
      NEERIKKHA_TESSERACT_FALLBACK: ${TESSERACT_FALLBACK:-false}
      NEERIKKHA_CORS_ORIGINS: '["http://127.0.0.1:5174","http://localhost:5174","http://127.0.0.1:8080"]'
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - "document_keys:/run/neerikkha-keys:ro"
      - "./.secrets/gemini-api-key.txt:/run/secrets/gemini-api-key.txt:ro"
    depends_on:
      key-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
      chroma: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
  key-init:
    build: ./backend
    user: "0:0"
    command: ["python", "scripts/init_key.py"]
    volumes: ["document_keys:/keys"]
  migrate:
    build: ./backend
    command: ["python", "scripts/migrate.py"]
    environment: *backend_environment
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: ./backend
    volumes:
      - "document_keys:/run/neerikkha-keys:ro"
      - "./.secrets/gemini-api-key.txt:/run/secrets/gemini-api-key.txt:ro"
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    depends_on:
      key-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  document_keys:
  postgres_data:
  redis_data:
  storage_data:
  chroma_data:
